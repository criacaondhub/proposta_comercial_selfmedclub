version: "3.7"

services:
  selfmedclub-proposta:
    image: selfmedclub-proposta:latest
    build: .
    networks:
      - GustavoSaNet
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      labels:
        - traefik.enable=true
        # Só a subpasta da proposta; o resto do domínio continua no serviço atual
        - traefik.http.routers.selfmedclub-proposta.rule=Host(`dr.gustavosa.com.br`) && PathPrefix(`/selfmedclub/proposta`)
        # Prioridade explícita: vence o router do site principal no mesmo domínio
        - traefik.http.routers.selfmedclub-proposta.priority=1000
        - traefik.http.routers.selfmedclub-proposta.entrypoints=websecure
        - traefik.http.routers.selfmedclub-proposta.tls.certresolver=letsencryptresolver
        - traefik.http.routers.selfmedclub-proposta.service=selfmedclub-proposta
        - traefik.http.services.selfmedclub-proposta.loadbalancer.server.port=80
        - traefik.http.services.selfmedclub-proposta.loadbalancer.passHostHeader=true

networks:
  GustavoSaNet:
    name: GustavoSaNet
    external: true
