server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proposta privada: nenhum buscador indexa (vale também para imagens e arquivos)
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location = /selfmedclub/proposta {
        return 301 /selfmedclub/proposta/;
    }

    location /selfmedclub/proposta/ {
        try_files $uri $uri/ /selfmedclub/proposta/index.html;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Cache-Control "no-cache";
    }

    # JS e CSS do build têm hash no nome — podem ficar em cache para sempre
    location ~* ^/selfmedclub/proposta/assets/.+\.(js|css)$ {
        expires 1y;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Cache-Control "public, immutable";
    }

    # Imagens e fontes mantêm o mesmo nome quando trocadas — cache curto
    location ~* ^/selfmedclub/proposta/.+\.(webp|jpg|jpeg|png|svg|gif|otf|woff2?)$ {
        expires 1d;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml font/otf;
}
